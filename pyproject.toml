# pyproject.toml
#
# devman declares no Python package yet. The CLI is deferred to stage 3 of the
# rollout in .scratch/projects/006-automation-plane/CONCEPT.md, so this file
# carries tool configuration only.
#
# When `src/devman/` returns it needs: [project], [project.scripts], and a
# [build-system].

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

# `.scratch/` is design work: investigation scripts, NixOS test bodies whose
# globals the test driver injects, and vendored upstream clones. None of it is
# code this repository owns, so the `base:lint` task does not lint it.
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-v"
python_files = ["test_*.py", "*_test.py"]
markers = [
  "unit: fast, isolated tests",
  "integration: integration or external dependency coverage",
]
