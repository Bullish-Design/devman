# pyproject.toml
#
# The CLI (CONCEPT.md §10). It ships from `nixosModules.default` only — see
# `nix/devman-cli.nix` and the note at the top of `src/devman/cli.py` — so this
# file describes the package and nothing installs it with pip.
#
# `devman 0.2.0` was a different program under the same name, removed from this
# machine's profile at stage 1 (§3.3, `STAGE_1_LOG.md` S11). The version starts
# at 0.3.0 so that the two are never confused in a profile listing.

[project]
name = "devman"
version = "0.3.0"
description = "The devman automation plane's CLI — run, show, doctor, watch"
requires-python = ">=3.13"
dependencies = ["pyyaml"]

[project.scripts]
devman = "devman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devman"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

# `.scratch/` is design work: investigation scripts, NixOS test bodies whose
# globals the test driver injects, and vendored upstream clones. None of it is
# code this repository owns, so the `base:lint` task does not lint it.
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-v"
python_files = ["test_*.py", "*_test.py"]
markers = [
  "unit: fast, isolated tests",
  "integration: integration or external dependency coverage",
]
