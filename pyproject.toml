[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devman"
version = "0.1.0"
description = "Self-bootstrapping file-oriented learning system"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "copier>=9.0.0",
    "pyyaml>=6.0.0",
    "tomli-w>=1.0.0",
    "rich>=13.0.0",
    "watchfiles>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.2",
    "pytest-cov==4.1.0",
    "ruff==0.1.6",
    "mypy==1.6.1",
]

[project.scripts]
devman = "devman.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
