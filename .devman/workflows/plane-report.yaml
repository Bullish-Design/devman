# devman/plane-report — one nightly report on the whole plane (stage 7).
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS, AND WHY IT IS HERE RATHER THAN IN A GROUP
#
# `base/maintain` used to run `devman doctor` in every registered repository.
# `doctor` forks one `dagu validate` per projected file, so at 58 projects and
# roughly 174 files that is about 13 CPU-minutes every night producing 58
# IDENTICAL plane-wide reports (PROPOSAL.md §5).
#
# **58 identical failures is not a signal. One is.** So the check moved here.
#
# It belongs to `devman` and not to a group because §11 already says so: a
# workflow that belongs to no project belongs to this one. `doctor` reads the
# whole registry, so its report is about the machine rather than about any
# repository, and a group file that shipped it would run it 58 times again.
#
# ---------------------------------------------------------------------------
# IT HOLDS `DEVMAN_PROJECT_DIR`, AND THAT IS CORRECT (§11)
#
# §11's rule is about a workflow that TRIGGERS other workflows: a parent's
# environment outranks every child's own value, so a parent must name
# `DEVMAN_SELF_DIR` instead. This workflow triggers nothing — it runs one
# command that READS the registry — so it targets its own project like
# `maintain` does, and the projection gives it the ordinary variable.
# `devman doctor`'s own cross-repo check is what proves it: this file must not
# appear in that count.
#
# ---------------------------------------------------------------------------
# `|| rc=$?` IS LOAD-BEARING, AND THIS IS THE ONE THING THAT HAD TO BE MEASURED
#
# **Dagu runs a step's script with `set -e` already on.** Measured: a step that
# prints `$-` reports `ehuB` (STAGE_7_LOG.md, S-5). So a bare failing command
# ABORTS THE SCRIPT at that line — the rest of the step never runs.
#
# `devman doctor` exits non-zero when it has findings, which is precisely the
# night this report matters. Written as
#
#     devman doctor >> "$report" 2>&1        # <- WRONG
#     rc=$?
#     printf '```\n' >> "$report"
#
# the script dies on the first line: the report keeps an unterminated code fence
# and no verdict, and nothing says why. That is the shape `base/maintain` used
# until stage 7, and it never fired only because `doctor` had never had a
# finding on a scheduled night.
#
# `|| rc=$?` makes the call a compound command whose failure is handled, so
# `-e` does not abort and the report is finished before the step exits.
#
# `continue_on: {failure: true}` — `base/review`'s answer — is the wrong tool
# here. It exists so a CHAIN can finish; one step has nothing to keep going
# for, and it would report `partially succeeded`, which says the workflow half
# worked when what actually happened is that the plane is unhealthy.
#
# WHY IT DEFINES NO `handler_on`: one would replace base.yaml's, and the run
# would then write no `metadata.jsonl` line at all — silently, with a clean
# `dagu status` and correct logs (§9.2, S3).
#
# ---------------------------------------------------------------------------
# IT ALSO READS THE MACHINE'S DISK ALLOCATION, BECAUSE NOTHING ELSE DOES (015)
#
# `df` IS NOT ABLE TO SHOW THE NUMBER THAT MATTERS ON btrfs. A btrfs filesystem
# hands raw device space to data and metadata in chunks. When every chunk is
# handed out, a write that needs a NEW metadata chunk fails with ENOSPC while
# `df` still reports free space inside the chunks already allocated. 014 spent
# hours reading that failure as a flake-input defect and retracted the finding
# (014 `RESULT.md` §16). Measured here on 2026-09-05: `df` reported 71 G free
# and 84 % used, while `Device unallocated` was 2.00 GiB of a 443.94 GiB
# device — 0.45 %.
#
# THE THRESHOLD IS THE CHUNK SIZE, NOT A TASTE. btrfs allocates a metadata
# chunk of up to 1 GiB, and this machine's metadata profile is DUP, so one more
# metadata chunk costs up to 2 GiB of unallocated device. Below that the
# filesystem cannot promise itself another metadata chunk, which is the
# ENOSPC 014 hit. So: fail under 2 GiB, warn under 5 GiB.
#
# IT IS MACHINE SCOPE, WHICH IS WHY IT IS IN THIS FILE AND NOT IN A GROUP. The
# disk belongs to the machine, not to any repository. A group workflow would
# ask the same question 54 times and produce 54 identical answers — the same
# arithmetic that moved `doctor` here in the first place. This adds no
# projected file to any repository.
#
# IT NAMES NO PATH, BY LAW 5. `stat -f` and `btrfs filesystem usage` both read
# `.`, which the projection has already set to this project's `working_dir`.
# A workflow file that named `/home` would hold a machine fact.
#
# ON A FILESYSTEM THAT IS NOT btrfs IT SAYS SO AND DOES NOT FAIL. That is not
# §12 rule 4's silent success: the report states the filesystem it found and
# that the guard does not apply to it, which a reader can tell apart from a
# clean btrfs result.
#
# CHEAP BY CONSTRUCTION, MEASURED: `btrfs filesystem usage -b .` is 4 ms
# (n=10, warm, this machine). It reads allocation metadata and walks nothing.
#
# ---------------------------------------------------------------------------
# THE SCHEDULE
#
# `20 0 * * *` — fifteen minutes after `maintain`'s `5 0 * * *`, so that the
# nightly `maintain` runs have finished pruning before the plane is asked how it
# is. `light` because it forks a subprocess per projected file and does nothing
# else; if that cost passes 30 s the answer is `doctor --project` scope
# (PLAN.md, R-4b), not a heavier queue.
schedule: "20 0 * * *"
queue: light
steps:
  - id: report
    name: report
    run: |
      set -u
      report=".devman/.runs/reports/plane-${context.run.id}.md"
      mkdir -p .devman/.runs/reports

      {
        echo "# plane report — ${context.dag.name}"
        echo
        echo "- run id: \`${context.run.id}\`"
        echo "- started: ${context.attempt.started_at}"
        echo
        echo '## devman doctor'
        echo
        echo '```'
      } > "$report"

      rc=0
      devman doctor >> "$report" 2>&1 || rc=$?

      {
        echo '```'
        echo
        echo "- doctor exit: $rc"
      } >> "$report"

      # The machine's disk allocation. `|| rc=$?` discipline applies here too:
      # this section must never abort the step before the report is finished.
      {
        echo
        echo '## disk'
        echo
      } >> "$report"

      fstype=$(stat -f -c '%T' . 2>/dev/null) || fstype=unknown
      if [ "$fstype" != "btrfs" ]; then
        echo "ok  filesystem is \`$fstype\` — this guard reads btrfs allocation only." >> "$report"
      else
        usage=$(btrfs filesystem usage -b . 2>/dev/null) || usage=""
        unalloc=$(printf '%s\n' "$usage" | awk '/Device unallocated:/ {print $3; exit}')
        size=$(printf '%s\n' "$usage" | awk '/Device size:/ {print $3; exit}')
        if [ -z "$unalloc" ] || [ -z "$size" ]; then
          echo "ok  btrfs, but \`btrfs filesystem usage\` gave no allocation line — nothing read." >> "$report"
        else
          pct=$(( unalloc * 10000 / size ))
          human="$(( unalloc / 1073741824 )).$(( unalloc % 1073741824 * 100 / 1073741824 )) GiB"
          total="$(( size / 1073741824 )) GiB"
          if [ "$unalloc" -lt 2147483648 ]; then
            {
              echo "FAIL  device unallocated $human of $total ($((pct/100)).$((pct%100)) %)"
              echo "      Below one DUP metadata chunk. A write needing a new metadata"
              echo "      chunk can fail with ENOSPC while df still reports free space."
              echo "      Run \`btrfs balance start -dusage=<n> .\` to return chunks to the pool."
            } >> "$report"
            rc=1
          elif [ "$unalloc" -lt 5368709120 ]; then
            {
              echo "warn  device unallocated $human of $total ($((pct/100)).$((pct%100)) %)"
              echo "      Approaching the point where btrfs cannot allocate another"
              echo "      metadata chunk. df cannot show this number (014 §16)."
            } >> "$report"
          else
            echo "ok  device unallocated $human of $total ($((pct/100)).$((pct%100)) %)" >> "$report"
          fi
        fi
      fi

      cat "$report"
      exit "$rc"
