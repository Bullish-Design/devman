# devman/stack-validate — a cross-repository workflow (CONCEPT.md §11).
#
# A workflow spanning several projects belongs to none of them, so it belongs to
# this repository: devman registers itself like any other project, and this is
# simply one of its own files. Its steps trigger other projects' workflows
# rather than running commands, so it resolves nothing itself.
#
# ---------------------------------------------------------------------------
# THE ONE RULE, AND WHY EVERY LINE BELOW BENDS AROUND IT (§11, finding A6)
#
# `DEVMAN_PROJECT_DIR` names the project a run TARGETS, and is set only by
# whatever triggers the run. A parent exports its parameters into every child's
# environment, and that environment outranks the child's own `params:`, its
# `env:` block, and even an explicit `with.params` override — whenever the names
# collide. So a parent holding `DEVMAN_PROJECT_DIR` silently drags every child
# into ITS directory: the children run, succeed, and do the work in the wrong
# place, and nothing reports it.
#
# Hence `DEVMAN_SELF_DIR`. Once the names differ, `with.params` works exactly as
# documented and a parent can direct each child deliberately.
#
# `working_dir` and `log_dir` are stated here rather than inherited, because
# base.yaml's copies name `DEVMAN_PROJECT_DIR` — the very name this file must
# not hold. An unset variable is not an error in Dagu: it creates a directory
# named literally `${DEVMAN_PROJECT_DIR}` and carries on (A3).
#
# ---------------------------------------------------------------------------
# WHY THE TARGETS ARE PARAMETERS AND NOT PATHS
#
# Criterion 10 says no workflow contains an absolute path, and only the registry
# knows where a project sits. So this file names the projects it needs as
# parameters and the trigger fills them in from the registry.
#
# EACH DEFAULT IS A PROJECT NAME, AND THAT IS THE CONVENTION `devman run` READS.
#
# A declared parameter whose default names a registered project is filled with
# that project's path (§10). The name of the parameter is this file's own
# business — the plane reserves no name shape and §7.1's list of four stays
# closed. What it reads is the value, which is an identity rather than a path,
# so criterion 10 still holds and the file still contains no absolute path.
#
# `DEVMAN_SELF_DIR` needs no such default: `devman run` knows which project owns
# the workflow it is triggering, because it found the file in that project's
# projection.
#
# Triggered by hand instead, each parameter is resolved from the registry by the
# person doing it — see .devman/workflows/README.md, which is still the
# specification this file is written against.
params:
  - DEVMAN_SELF_DIR: ""
  - OBSERVANTIC_DIR: observantic
  - SITEMAN_DIR: siteman

working_dir: ${DEVMAN_SELF_DIR}
log_dir: ${DEVMAN_SELF_DIR}/.devman/.runs/logs

# `normal` rather than `light`: this file's OWN run takes one slot, and holds it
# for as long as both children take together.
#
# THE CHILDREN TAKE NO SLOT AT ALL, AND THE LINE BELOW IS WHAT SERIALISES THEM.
#
# This comment used to say "this fans out into two child runs, each of which
# takes a slot in its own queue". It does not, and the correction matters more
# than the queue name. Measured on Dagu 2.15.0: two children both naming a queue
# of limit 1 started 12 ms apart and ran CONCURRENTLY under `action: dag.run`,
# while the same two through `dag.enqueue` serialised and the scheduler logged
# the admission (`STAGE_7_LOG.md`, S-8). A `dag.run` child is executed in place
# by its parent and never reaches the queue that would have admitted it. This is
# §12 rule 8's sibling: the queue does not throttle a scheduled run either.
#
# So `type: chain` is load-bearing here rather than a matter of taste — it is the
# only thing bounding this file's fan-out, and Dagu's default is the opposite: a
# file stating no `type` runs its steps concurrently, and `base.yaml` states
# none. Keep it. A third repository added under `type: graph` would run all three
# checks at once against every queue limit on the machine.
#
# To bound a fan-out deliberately, state one of the three: `type: chain`,
# `max_active_steps`, or `parallel.max_concurrent`. `devman doctor`'s fan-out
# check reports a file that states none.
queue: normal
type: chain

steps:
  - name: observantic-check
    action: dag.run
    with:
      dag: observantic-check
      params:
        DEVMAN_PROJECT_DIR: ${OBSERVANTIC_DIR}

  - name: siteman-check
    action: dag.run
    with:
      dag: siteman-check
      params:
        DEVMAN_PROJECT_DIR: ${SITEMAN_DIR}
