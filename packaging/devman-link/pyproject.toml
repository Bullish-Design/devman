# The independent link adapter's own package (038 Stage 16, B).
#
# WHY A SECOND PYPROJECT, AND WHAT IT PROVES.
#
# The repository root `pyproject.toml` builds all three packages together,
# because the `devman` CLI imports `devman_link`. That build cannot show that
# the adapter is independent: `devman` is on the path either way, so an
# accidental `import devman.registry` inside the component would pass it.
#
# This file names the two packages the adapter is allowed to hold and nothing
# else. `nix/link-adapter.nix` assembles a source tree from `src/devman_link`,
# `src/devman_contract` and this file, and runs the command in its install
# check. A coupling back to the plane therefore fails a build rather than
# reaching a machine. That is AGENTS.md law 4: prefer a check that can fail to
# one that cannot.
#
# The version tracks the root `pyproject.toml`, which `nix/renderer.nix` and
# `nix/devman-cli.nix` also state. Four places now have to agree.

[project]
name = "devman-link"
version = "0.6.0"
description = "The devman link adapter — reconcile one repository's link plane"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
devman-link = "devman_link.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devman_link", "src/devman_contract"]
