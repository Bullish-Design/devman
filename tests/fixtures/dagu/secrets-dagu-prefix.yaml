# Dagu's `secretRef.name` carries `not: {pattern: '^DAGU_'}`, so a workflow
# naming a secret with that prefix cannot resolve one at all (022).
#
# `src/devman/agent.py` refuses the same name in `--secret`, one layer earlier,
# so the message names the reason rather than a schema. This fixture is what
# proves the refusal it anticipates is real.
secrets:
  - name: DAGU_TOKEN
    provider: env
    key: SOMETHING
steps:
  - name: s
    run: echo hi
