# Accepted, and NOT a fan-out finding: dag.enqueue is the path that admits
# through the queue. It is also not a substitute for dag.run — it is
# fire-and-forget and never reports the child's result (S-8).
params:
  - DEVMAN_SELF_DIR: /tmp
steps:
  - name: a
    action: dag.enqueue
    with: {dag: child}
