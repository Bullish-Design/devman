# §9.4's block, in the shape `groups/agent/workflows/agent.yaml` uses, and the
# shape project 022 measured on this pin.
#
# WHAT WAS MEASURED, WITH A RUNNING DAG AND NOT ONLY `validate` (022 EVIDENCE):
#
#   * the step receives the true value, and the log holds `*******`;
#   * the SAME step echoing the first five characters logged them IN CLEAR —
#     masking covers the exact value and nothing else;
#   * a resolved secret is logged as `Resolving secrets count=1` before any step
#     starts, so a provider with no value fails the run before any step runs.
#
# `provider: env` reads the Dagu USER SERVICE's environment, which the machine
# module sets. Nothing in this repository holds a value.
#
# The block is per workflow. Dagu also accepts one in `base.yaml`, which would
# grant every workflow on the machine every secret — §9.4 refuses that, and
# `doctor` has no check for it because the machine module never writes one.
secrets:
  - name: PROBE_TOKEN
    provider: env
    key: PROBE_SOURCE
steps:
  - name: s
    run: echo hi
