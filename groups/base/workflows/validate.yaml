# base/validate — the gate (CONCEPT.md §7.2).
#
# Dagu owns the composition, devenv owns each implementation (§6). `chain` runs
# the steps in order, so one checkout never holds two devenv invocations.
#
# `-v` is load-bearing. Without it a task's stdout never reaches the log, so a
# failed lint reports that it failed and not what it found (S4).
queue: normal
type: chain
steps:
  - name: lint
    run: devenv tasks run -v base:lint
  - name: test
    run: devenv tasks run -v base:test
