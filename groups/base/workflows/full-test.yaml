# base/full-test — the exhaustive one (CONCEPT.md §7.2).
#
# The third step is `devenv test`, not a third repository task. Every devenv
# repository already has it, so the exhaustive workflow costs a repository
# nothing beyond the two names `base` already asks for.
queue: heavy
type: chain
steps:
  - name: lint
    run: devenv tasks run lint
  - name: test
    run: devenv tasks run test
  - name: devenv-test
    run: devenv test
