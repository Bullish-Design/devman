# python/check — shadows base/check (CONCEPT.md §7.3).
#
# The difference from base is the whole point of the group: Python separates a
# type checker from a linter, and base cannot assume one exists.
#
# `-v` is load-bearing. ruff and every type checker write their findings to
# stdout, and without the flag `devenv tasks run` captures stdout and prints
# nothing — so the log of a failed check is `{}` (S4).
queue: light
type: chain
steps:
  - name: lint
    run: devenv tasks run -v python:lint
  - name: typecheck
    run: devenv tasks run -v python:typecheck
