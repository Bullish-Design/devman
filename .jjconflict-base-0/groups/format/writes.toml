# format — what this group's workflow writes, and under which tier of §12 rule 3
# as amended (015).
#
# ONE TABLE PER WORKFLOW. `tier` is `free`, `lane` or `insitu`; `paths` is the
# set of globs the workflow writes, relative to the repository root.
#
# WHY THIS FILE IS HERE AND NOT A KEY IN `format.yaml`. The same measurement
# that put `triggers.toml` here (A5), re-verified in 015: `dagu validate`
# rejects an unknown top-level `writes:` outright, and `tags:` — the one
# extension point Dagu accepts — is a label map restricted to `a-zA-Z0-9-_.`,
# so it can hold neither a `:` nor a `/` nor a `*`. A glob cannot be expressed
# there at all.
#
# `format` IS THE ONLY HOLDER OF `insitu`, AND THAT IS THE POINT.
#
# The rule this amendment replaced ended "`format` is the single exception and
# it is bounded three ways: one glob, a content hash, and its own group". The
# tier keeps that sentence enforceable rather than deleting it. `format` earns
# it because its write is an IDEMPOTENT NORMALISATION of the file its own
# trigger watched: it adds no content, and a second run changes nothing. Code
# generation, dependency updates and autofix beyond formatting are none of
# those things, and they are tier `lane`.
#
# THE GLOB IS THE SAME ONE, IN A THIRD PLACE, AND THE WIDENING RULE NOW COVERS
# IT. `triggers.toml` maps `**/*.py`, `format.yaml`'s precondition hashes
# `**/*.py`, and this declares `**/*.py`. `format.yaml` already states that
# adding a glob to the trigger requires widening the hash in the same edit;
# this file joins that list. A `paths` narrower than the hash claims ownership
# of less than the workflow rewrites, which is the claim `doctor` is auditing.
[format]
tier  = "insitu"
paths = ["**/*.py"]
