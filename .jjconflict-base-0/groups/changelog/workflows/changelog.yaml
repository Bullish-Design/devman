# changelog/changelog — summarise the newly landed entries into CHANGELOG.md,
# on a gitman lane for a person to merge (`.scratch/projects/021-changelog/
# DESIGN.md`, §2.2). The plane's first tier-B writer (015).
#
# ---------------------------------------------------------------------------
# CHAINED, NOT INDEPENDENTLY TRIGGERED, AND WHY THAT COST TWO WORKFLOWS
#
# `changelog-entries.yaml` (this group's other file) fires from the taking
# repository's own `gitman.toml` `[land].post_hook`, and its last step enqueues
# this DAG. This file is also runnable by hand (`devman run changelog`), for a
# retry after an LLM hiccup that needs no re-generation of entry files.
#
# ---------------------------------------------------------------------------
# THE GATE IS A STEP THAT FAILS; IT DOES NOT SKIP (`release.yaml`'s reasoning,
# restated here because it is this project's central design constraint,
# DESIGN.md §1)
#
# "No un-summarised entries" must record `Failed`, not `Succeeded` with a
# skipped step — the latter is right for `format`'s self-stopping loop and
# wrong for a refusal that would otherwise open an empty lane (016's
# 52-empty-branches failure, in miniature, per commit).
#
# THE FRONTIER LIVES INSIDE `CHANGELOG.md` ITSELF, NOT A SEPARATE RECEIPT.
#
#     <!-- devman-changelog: covers up to <sha> -->
#
# A side-file receipt (as `changelog-entries.yaml` uses for its own frontier)
# can desync from what the tracked file actually contains if a lane is
# abandoned rather than landed. Reading the marker out of `CHANGELOG.md` itself
# means the frontier and the artifact can never disagree.
#
# Filtering by "an entry file exists for this commit" — not "this commit is
# new" — is deliberate: it is also the check that catches
# `changelog-entries` having been skipped or having failed upstream of the
# chain. A commit with no detail file behind it is not summarised, and the gap
# is visible in the section this workflow writes rather than papered over.
#
# ---------------------------------------------------------------------------
# THE LANE, AND WHY THE COLLISION IS CHECKED BEFORE `gitman start`, NOT AFTER
#
# `gitman start` is not idempotent (gitman `.scratch/projects/
# 39-lane-lifecycle-facts/ISSUE.md`: `ensure_unique` refuses a name collision
# outright). A fixed lane name (`changelog`) turns a re-run before the prior
# lane landed into a check this workflow can make and explain, rather than a
# raw `start` error a re-run would otherwise hit blind.
#
# ---------------------------------------------------------------------------
# THE LLM STEP REUSES `gitman-commit-message.yaml`'S SHAPE EXACTLY, AND THAT IS
# THE WHOLE POINT OF CHOOSING IT
#
# `queue: gpu`, no `secrets:` block, `scripts/gpu_complete.py` (an unmodified,
# uninstalled `uv run --script`) calling any OpenAI-compatible endpoint at
# `$GPU_LLM_BASE_URL` — a local, unauthenticated server. 020's two open
# questions for a scheduled, quota-metered, CLOUD LLM workload — a sixth queue
# name, and exercising §9.4's secrets path for the first time — do not apply
# here: this is neither scheduled (it is triggered, through `dagu enqueue`,
# which respects the queue) nor an externally metered API. It is the same
# local call `gitman-commit-message.yaml` already makes.
#
# RULE-4 EXPOSURE IS SHARPER FOR AN LLM THAN FOR ANYTHING ELSE THIS PLANE RUNS
# (020 §4.3) — a fluent, empty answer is exit 0 and a full log. Bounded two
# ways here, not zero: the step cannot fire on an empty batch (the gate above
# already refused that), and the written section lists every commit verbatim
# beside the prose, so a hollow summary is caught by a person reading it next
# to the commit list it claims to describe — not trusted on its own.
#
# `head -c 60000` bounds the input the same way `gitman-commit-message.yaml`
# and `agent:review` both do: an unbounded diff is an unbounded bill.
queue: gpu
type: chain
steps:
  - id: gate
    name: gate
    run: |
      set -eu
      last=$(git show HEAD:CHANGELOG.md 2>/dev/null | sed -n 's/.*covers up to \([0-9a-f]*\).*/\1/p' | head -1)
      if [ -z "$last" ]; then
        echo "changelog: CHANGELOG.md has no 'covers up to' marker — bootstrap it by hand first" >&2
        exit 1
      fi
      : > .devman/.runs/.changelog-pending
      for sha in $(git rev-list --reverse "$last..HEAD"); do
        if [ -f ".devman/changelog/entries/$sha.md" ]; then
          echo "$sha" >> .devman/.runs/.changelog-pending
        fi
      done
      count=$(wc -l < .devman/.runs/.changelog-pending)
      if [ "$count" -eq 0 ]; then
        echo "changelog: no un-summarised entries since $last — refusing rather than opening an empty lane" >&2
        exit 1
      fi
      echo "$count"

  - id: lane
    name: start-lane
    run: |
      set -eu
      if gitman status --json 2>/dev/null | grep -q '"name":"changelog"'; then
        echo "changelog: a changelog lane already awaits review — land it before running again" >&2
        exit 1
      fi
      gitman start changelog

  - id: summarize
    name: summarize
    run: |
      set -eu
      {
        printf '%s\n\n' "Summarise this batch of commits for a changelog entry read by someone who does not want diff detail. Group related commits into one or two sentences each. No preamble, no markdown fences, output only the summary body."
        while read -r sha; do
          printf '\n--- %s ---\n' "$sha"
          cat ".devman/changelog/entries/$sha.md"
        done < .devman/.runs/.changelog-pending
      } | head -c 60000 | uv run --script scripts/gpu_complete.py > .devman/.runs/.changelog-summary.md

  - id: write
    name: write
    run: |
      set -eu
      newest=$(tail -1 .devman/.runs/.changelog-pending)
      {
        echo "<!-- devman-changelog: covers up to $newest -->"
        echo
        echo "## $(date +%Y-%m-%d)"
        echo
        cat .devman/.runs/.changelog-summary.md
        echo
        while read -r sha; do
          echo "- $(git log -1 --format='%s' "$sha") ($sha)"
        done < .devman/.runs/.changelog-pending
        echo
        tail -n +2 CHANGELOG.md
      } > CHANGELOG.md.new
      mv CHANGELOG.md.new CHANGELOG.md
      gitman save -m "docs: update the changelog"
